[project]
name = "callscribe"
version = "0.1.0"
description = "Local macOS call recorder and speaker-labeled transcript tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catap>=0.6.0",
    "typer>=0.19.0",
]

[project.optional-dependencies]
# Phase 2+: speech models
transcribe = [
    "mlx-whisper>=0.4.3",
    "pyannote-audio>=4.0.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
callscribe = "callscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: model-heavy or long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Argument/Option defaults are intentional
