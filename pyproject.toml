[project]
name = "callscribe"
version = "0.1.0"
description = "Local macOS call recorder and speaker-labeled transcript tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catap==0.6.0",
    "mlx-whisper==0.4.3",
    "pyannote-audio==4.0.7",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[project.scripts]
callscribe = "callscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship Cursor skills inside the wheel so `setup` can install personal copies.
[tool.hatch.build.targets.wheel.force-include]
"src/callscribe/operator_skill" = "callscribe/operator_skill"
"src/callscribe/summarize_skill" = "callscribe/summarize_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: model-heavy or long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Argument/Option defaults are intentional
